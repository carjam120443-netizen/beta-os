name: Build Beta OS x86_64

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc binutils make nasm grub-pc-bin grub-common xorriso mtools qemu-system-x86

      - name: Build x86_64 kernel and ISO
        run: make

      - name: Smoke test kernel with QEMU
        run: |
          timeout 8s qemu-system-x86_64 -cdrom build/beta-os.iso -display none -serial none || test $? -eq 124

      - name: Upload Beta OS ISO
        uses: actions/upload-artifact@v4
        with:
          name: beta-os-x86_64-iso
          path: build/beta-os.iso

      - name: Upload kernel ELF
        uses: actions/upload-artifact@v4
        with:
          name: beta-os-x86_64-kernel
          path: build/kernel.elf
